# GeneralsX @build Codex 24/10/2026 Build an unsigned device IPA without Apple credentials.
name: Build iOS unsigned IPA

on:
  push:
    branches:
      - ci/ios-unsigned-ipa
      - experiment/ios-mod-testing
      - experiment/ios-community-patch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  community-patch:
    # GeneralsX @build Codex 02/11/2026 Allow explicitly requested push builds when dispatch access is unavailable.
    if: github.ref_name == 'experiment/ios-community-patch' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build community patch]'))
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Read pinned Community Patch source
        id: patch
        shell: pwsh
        run: |
          $config = Get-Content ios/community-patch/source.json -Raw | ConvertFrom-Json
          if ($config.repository -notmatch '^https://github.com/([^/]+/[^/]+)\.git$') { throw 'Invalid patch repository URL' }
          "repository=$($Matches[1])" >> $env:GITHUB_OUTPUT
          "commit=$($config.commit)" >> $env:GITHUB_OUTPUT
          "pack=$($config.pack)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v6
        with:
          repository: ${{ steps.patch.outputs.repository }}
          ref: ${{ steps.patch.outputs.commit }}
          submodules: recursive
          path: community-patch-source
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - name: Build pinned Full English data without installing the PC game
        shell: pwsh
        run: |
          $source = Resolve-Path community-patch-source
          $config = Get-Content ios/community-patch/source.json -Raw | ConvertFrom-Json
          $builder = git -C "$source/Tools/GeneralsModBuilder" rev-parse HEAD
          if ($builder -ne $config.builder_commit) { throw 'Unexpected Mod Builder commit' }
          uv run --locked --project "$source/Tools/GeneralsModBuilder" python scripts/build/ios/build-community-patch.py --source "$source"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build/ios/stage-community-patch.py --source "$source" --pack-dir "$source/Patch104pZH/.Build/RawBundlePacks/$($config.pack)" --output build/community-patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        with:
          name: CommunityPatch-FullEnglish
          path: build/community-patch/
          if-no-files-found: error
          retention-days: 14
      - name: Upload patch build logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: CommunityPatch-build-debug
          path: community-patch-source/Patch104pZH/.Build/**/*.log
          if-no-files-found: ignore

  build-ipa:
    needs: community-patch
    # GeneralsX @build Codex 02/11/2026 Patch runs require successful conversion; other branches keep the existing IPA path.
    if: always() && !cancelled() && (needs.community-patch.result == 'success' || (github.ref_name != 'experiment/ios-community-patch' && needs.community-patch.result == 'skipped'))
    # GeneralsX @build Codex 28/10/2026 Restore the macOS 15 ARM64 host pool at the user's request.
    runs-on: macos-15
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      VCPKG_MAX_CONCURRENCY: '3'
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      GX_BUNDLE_ID: org.generalsx.generalszh
      GX_MOD_TESTING_PROFILE: ${{ contains(fromJSON('["experiment/ios-mod-testing","experiment/ios-community-patch"]'), github.ref_name) && 'ON' || 'OFF' }}

    steps:
      - uses: actions/checkout@v6

      - name: Download pinned Community Patch data
        if: github.ref_name == 'experiment/ios-community-patch'
        uses: actions/download-artifact@v6
        with:
          name: CommunityPatch-FullEnglish
          path: build/community-patch

      - name: Verify compiled Community Patch artifact
        if: github.ref_name == 'experiment/ios-community-patch'
        run: python3 scripts/build/ios/stage-community-patch.py --verify build/community-patch

      - name: Check packaging behavior
        run: |
          python3 - <<'PYTEST'
          import subprocess
          import sys
          tests = [
              "test_ios_packaging.py", "test_startup_primitives.py", "test_csf_reserved_header.py", "test_openal_stream.py",
              "test_wwlib_pool.py", "test_audio_cache.py", "test_ffmpeg_ownership.py", "test_community_patch.py", "test_memory_counters.py",
              "test_paused_messages.py",
              "test_raw_memory.py",
              "test_unix_worker.py", "test_ios_native_callbacks.py",
              "test_pathfind_heap.py", "test_hierarchical_edges.py",
              "test_strip_diagnostics.py", "test_quad_lists.py",
              "test_dxvk_cache_reset.py", "test_search_context.py",
              "test_search_record_pool.py", "test_owned_path_route.py", "test_path_request_inputs.py",
              "test_path_movement_inputs.py", "test_occupancy_worker.py",
              "test_search_context_binding.py", "test_exclusive_search_worker.py", "test_parallel_path_batch.py",
              "test_complete_path_worker.py",
              "test_zone_merges.py", "test_frozen_occupancy_cache.py", "test_reused_path_contexts.py", "test_path_lookahead.py",
              "test_joined_search_pool.py", "test_participant_path_pool.py",
              "test_four_request_path_pool.py",
              "test_build_warning_fixes.py",
          ]
          for test in tests:
              result = subprocess.run([sys.executable, "scripts/qa/" + test], text=True, capture_output=True)
              output = result.stdout + result.stderr
              print(output, flush=True)
              if result.returncode:
                  detail = output[-6000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print("::error title=" + test + "::" + detail, flush=True)
                  sys.exit(result.returncode)
          PYTEST

      - name: Check copied-query worker with ThreadSanitizer
        if: github.ref_name == 'experiment/ios-mod-testing'
        env:
          CXX: clang++
        run: |
          # GeneralsX @build Codex 27/10/2026 Make captured race-check failures reviewable in job annotations.
          python3 - <<'PYTEST'
          import subprocess
          import sys
          for test in ["test_occupancy_worker.py", "test_search_context_binding.py",
                       "test_exclusive_search_worker.py", "test_parallel_path_batch.py", "test_complete_path_worker.py",
                       "test_zone_merges.py", "test_frozen_occupancy_cache.py", "test_reused_path_contexts.py", "test_path_lookahead.py",
                       "test_joined_search_pool.py", "test_participant_path_pool.py", "test_four_request_path_pool.py"]:
              result = subprocess.run([sys.executable, "scripts/qa/" + test, "--tsan"], text=True, capture_output=True)
              output = result.stdout + result.stderr
              print(output, flush=True)
              if result.returncode:
                  detail = output[-12000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print("::error title=" + test + " ThreadSanitizer::" + detail, flush=True)
                  sys.exit(result.returncode)
          PYTEST

      - name: Initialize the pinned iOS DXVK fork
        run: git submodule update --init --recursive references/fbraz3-dxvk

      - name: Select Xcode and install build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          # GeneralsX @build Codex 31/10/2026 Hosted images already contain some tools; install only missing formulae.
          missing_tools=()
          missing_tools_count=0
          for tool in cmake ninja meson pkg-config xcodegen glslang autoconf autoconf-archive automake libtool; do
            if ! brew list --versions "$tool" >/dev/null 2>&1; then
              missing_tools+=("$tool")
              missing_tools_count=$((missing_tools_count + 1))
            fi
          done
          if (( missing_tools_count )); then
            brew install "${missing_tools[@]}"
          fi
          mkdir -p logs "$VCPKG_DEFAULT_BINARY_CACHE"

      # This revision includes the manifest's FFmpeg 8.1.1#2 override.
      - name: Set up vcpkg
        run: |
          # GeneralsX @build Codex 31/10/2026 Bootstrap the same pinned checkout directly, avoiding the action's deprecated Node dependencies.
          set -euo pipefail
          vcpkg_revision=08098dce081e9411889686fc3f4aecbde95fc2b1
          vcpkg_root="$RUNNER_TEMP/generals-ios-vcpkg"
          git init "$vcpkg_root"
          git -C "$vcpkg_root" remote add origin https://github.com/microsoft/vcpkg.git
          # Versioned manifests also need historical port trees from the registry.
          git -C "$vcpkg_root" fetch origin "$vcpkg_revision"
          git -C "$vcpkg_root" -c advice.detachedHead=false checkout --detach FETCH_HEAD
          test "$(git -C "$vcpkg_root" rev-parse HEAD)" = "$vcpkg_revision"
          "$vcpkg_root/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$vcpkg_root" >> "$GITHUB_ENV"

      - name: Cache iOS dependency binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: .vcpkg-cache
          key: ios-vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/arm64-ios.cmake', '.github/workflows/build-ios.yml') }}
          restore-keys: ios-vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Use the persistent dependency cache
        run: |
          # Point vcpkg at the restored binary cache before manifest configuration.
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-cache" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$GITHUB_WORKSPACE/.vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      - name: Fetch verified iOS MoltenVK
        run: |
          set -euo pipefail
          export GX_MOLTENVK_ROOT="$RUNNER_TEMP/MoltenVK"
          bash scripts/build/ios/fetch-moltenvk.sh
          MVK_ROOT="$GX_MOLTENVK_ROOT/MoltenVK/MoltenVK"
          test -f "$MVK_ROOT/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"
          test -f "$MVK_ROOT/include/vulkan/vulkan.h"
          echo "GX_MOLTENVK=$MVK_ROOT/dynamic/MoltenVK.xcframework/ios-arm64/MoltenVK.framework" >> "$GITHUB_ENV"
          echo "GX_MVK_ROOT=$MVK_ROOT" >> "$GITHUB_ENV"

      - name: Configure iOS device build without signing
        id: configure
        run: |
          set -euo pipefail
          # GeneralsX @performance Codex 30/10/2026 Trial frozen-request occupancy reuse on the testing branch after the zone-only device baseline.
          # GeneralsX @performance Codex 30/10/2026 Reuse each complete-search participant arena for its sequential fallback.
          # GeneralsX @feature Codex 31/10/2026 Trial up to four logical requests on two participant arenas, keeping one background worker.
          cmake --preset ios-vulkan \
            -DGENERALS_COMMUNITY_PATCH=${{ github.ref_name == 'experiment/ios-community-patch' && 'ON' || 'OFF' }} \
            -DGENERALS_DXVK_CACHE_TAG=${{ env.GX_MOD_TESTING_PROFILE == 'ON' && 'quad-lists-v1' || '' }} \
            -DGENERALS_SEARCH_CONTEXT=${{ env.GX_MOD_TESTING_PROFILE }} \
            -DGENERALS_OCCUPANCY_SHADOW_VALIDATION=OFF \
            -DGENERALS_OWNED_PATH_ROUTE=OFF \
            -DGENERALS_OCCUPANCY_WORKER=${{ env.GX_MOD_TESTING_PROFILE }} \
            -DGENERALS_PARALLEL_PATH_BATCH=${{ env.GX_MOD_TESTING_PROFILE }} \
            -DGENERALS_COMPLETE_PATH_WORKER=${{ env.GX_MOD_TESTING_PROFILE }} \
            -DGENERALS_REUSE_PATH_CONTEXTS=${{ env.GX_MOD_TESTING_PROFILE }} \
            -DGENERALS_PATH_WORKER_POOL=${{ env.GX_MOD_TESTING_PROFILE }} \
            -DGENERALS_PATH_FOUR_REQUESTS=${{ env.GX_MOD_TESTING_PROFILE }} \
            -DGENERALS_PATH_LOOKAHEAD=${{ env.GX_MOD_TESTING_PROFILE }} \
            -DGENERALS_FAST_ZONE_MERGES=${{ env.GX_MOD_TESTING_PROFILE }} \
            -DGENERALS_FROZEN_OCCUPANCY_CACHE=${{ env.GX_MOD_TESTING_PROFILE }} \
            -DGENERALS_PATH_TIMING=${{ env.GX_MOD_TESTING_PROFILE }} \
            -DGENERALS_EXCLUSIVE_PATH_WORKER=${{ env.GX_MOD_TESTING_PROFILE }} \
            -DGENERALS_QUAD_LISTS=${{ env.GX_MOD_TESTING_PROFILE }} \
            -DGENERALS_STRIP_DIAGNOSTICS=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DVulkan_INCLUDE_DIR="$GX_MVK_ROOT/include" \
            -DVulkan_LIBRARY="$GX_MVK_ROOT/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a" \
            -DVulkan_MoltenVK_LIBRARY="$GX_MVK_ROOT/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a" \
            -DVulkan_MoltenVK_INCLUDE_DIR="$GX_MVK_ROOT/include" \
            2>&1 | tee logs/configure_ios.log

      - name: Build Zero Hour for iPhone and iPad
        id: build
        run: |
          set -euo pipefail
          # DXVK's external Meson build links the in-tree SDL3 library.
          # Make it available before Ninja starts DXVK in parallel.
          # The two names already identify the same file on case-insensitive macOS volumes.
          if [[ ! build/ios-vulkan/sdl3-pkgconfig/sdl3.pc -ef build/ios-vulkan/sdl3-pkgconfig/SDL3.pc ]]; then
            cp build/ios-vulkan/sdl3-pkgconfig/sdl3.pc build/ios-vulkan/sdl3-pkgconfig/SDL3.pc
          fi
          cmake --build build/ios-vulkan --target SDL3-shared --parallel 3 2>&1 | tee logs/build_sdl_ios.log
          cmake --build build/ios-vulkan --target z_generals --parallel 3 2>&1 | tee logs/build_ios.log

      - name: Package unsigned IPA without retail game assets
        env:
          GX_COMMUNITY_PATCH_DIR: ${{ github.ref_name == 'experiment/ios-community-patch' && format('{0}/build/community-patch', github.workspace) || '' }}
        run: |
          set -euo pipefail
          bash scripts/build/ios/package-ios-zh.sh --dev --unsigned 2>&1 | tee logs/package_ios.log
          unzip -t build/ios-package/GeneralsXZH-unsigned.ipa
          test -f build/ios-package/Payload/GeneralsXZH.app/GeneralsXZH
          test -f build/ios-package/GeneralsXZH.entitlements

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: GeneralsXZH-iOS-unsigned
          path: |
            build/ios-package/GeneralsXZH-unsigned.ipa
            build/ios-package/GeneralsXZH.entitlements
            build/ios-package/GeneralsXZH-embedded-entitlements.plist
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Summarize native build warnings
        if: always()
        run: |
          mkdir -p logs
          python3 scripts/build/ios/report-build-warnings.py \
            --outcome '${{ steps.build.outcome }}' \
            --output logs/ios-warning-summary.json \
            logs/configure_ios.log logs/build_sdl_ios.log logs/build_ios.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-build-logs
          path: |
            logs/*ios.log
            logs/ios-warning-summary.json
            build/ios-vulkan/vcpkg-manifest-install.log
            build/ios-vulkan/_deps/dxvk-build-macos/meson-logs/meson-log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Save completed dependency builds even if engine compilation fails
        if: always() && steps.configure.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
