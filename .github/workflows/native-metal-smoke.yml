name: Native Metal bootstrap smoke
on:
  push:
    branches: [feature/native-metal-renderer]
    paths:
      - 'native/metal/**'
      - '.github/workflows/native-metal-smoke.yml'
  workflow_dispatch:
jobs:
  macos-smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned DXVK headers
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/fbraz3/dxvk.git /tmp/gx-dxvk
          git -C /tmp/gx-dxvk checkout 46a3bc018bcae408d49d3c500e4e536a11f6789a
          echo "Pinned DXVK header locations:"
          find /tmp/gx-dxvk/include/native -iname '*d3d8*' -o -name windows_base.h | sort
          test -f /tmp/gx-dxvk/include/native/directx/d3d8.h || echo "D3D8 header absent in DXVK checkout; will fetch from pinned SDK"
          test -f /tmp/gx-dxvk/include/native/windows/windows_base.h || { echo "::error::Missing windows/windows_base.h"; exit 1; }
      - name: Fetch pinned D3D8 SDK headers
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/TheSuperHackers/min-dx8-sdk.git /tmp/gx-dx8-sdk
          git -C /tmp/gx-dx8-sdk checkout 7bddff8c01f5fb931c3cb73d4aa8e66d303d97bc
          find /tmp/gx-dx8-sdk/include -iname 'd3d8*.h' -print
          test -f /tmp/gx-dx8-sdk/include/d3d8.h
      - name: Configure
        run: cmake -S native/metal -B build-metal-smoke -DGX_METAL_SMOKE_TESTS=ON -DGX_D3D8_HEADER_ROOT=/tmp/gx-dx8-sdk/include -DGX_D3D8_WINDOWS_ROOT=/tmp/gx-dxvk/include/native/windows
      - name: Build
        run: cmake --build build-metal-smoke --parallel
      - name: Test
        run: |
          set -euo pipefail
          ctest --test-dir build-metal-smoke -N | tee /tmp/gx-tests.txt
          grep -q 'd3d8_header_contract' /tmp/gx-tests.txt
          ctest --test-dir build-metal-smoke --output-on-failure
